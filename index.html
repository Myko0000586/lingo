<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lingo — учим английский</title>

<!-- PWA / установка на iPhone -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lingo">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  :root{
    --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --red:#ff4b4b;
    --yellow:#ffc800; --purple:#ce82ff; --gray:#e5e5e5; --gray-d:#afafaf; --text:#3c3c3c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:'Segoe UI',-apple-system,system-ui,sans-serif; background:#f7f7f7; color:var(--text);}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  .hidden{display:none !important;}
  .muted{color:var(--gray-d); font-weight:600;}
  .small{font-size:13px;} .center{text-align:center;}
  .badge{display:inline-block; color:#fff; font-weight:800; font-size:13px; padding:4px 10px; border-radius:20px;}
  .badge.green{background:var(--green);}

  /* HUD */
  .topbar{position:sticky; top:0; z-index:10; background:#fff; display:flex; align-items:center; gap:16px;
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px; border-bottom:2px solid var(--gray); max-width:560px; margin:0 auto;}
  .stat{display:flex; align-items:center; gap:5px; font-weight:800; font-size:18px;}
  .stat.flame{color:#ff9600;} .stat.gem{color:var(--blue);} .stat.heart{color:var(--red);}
  .topbar .spacer{flex:1;}

  .app{max-width:560px; margin:0 auto; padding:16px 18px 110px;}

  /* path */
  .level-head{display:flex; align-items:center; justify-content:center; margin:30px 0 4px; position:relative;}
  .level-head:before{content:''; position:absolute; left:0; right:0; top:50%; height:2px; background:var(--gray);}
  .level-head span{position:relative; background:#f7f7f7; padding:4px 16px; font-size:13px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--gray-d);}
  .unit-head{color:#fff; border-radius:16px; padding:16px 20px; margin:24px 0 6px;}
  .unit-head h2{margin:0 0 2px; font-size:19px;} .unit-head p{margin:0; opacity:.9; font-size:13px;}
  .lessons{display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 0;}
  .lessons .row{display:flex; justify-content:center; width:100%;}
  .node{width:74px; height:66px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:30px; position:relative; transition:transform .1s;}
  .node:active{transform:translateY(3px);}
  .node.done{background:var(--yellow); box-shadow:0 5px 0 #d8a800;}
  .node.active{background:var(--green); box-shadow:0 5px 0 var(--green-d);}
  .node.locked{background:var(--gray); box-shadow:0 5px 0 #c8c8c8; color:#b0b0b0;}
  .off-0{transform:translateX(0)} .off-1{transform:translateX(-66px)} .off-2{transform:translateX(-92px)}
  .off-3{transform:translateX(-66px)} .off-4{transform:translateX(0)} .off-5{transform:translateX(66px)}
  .off-6{transform:translateX(92px)} .off-7{transform:translateX(66px)}
  .start-pop{position:absolute; top:-42px; left:50%; transform:translateX(-50%); background:#fff; color:var(--green);
    font-weight:800; font-size:12px; padding:7px 12px; border-radius:12px; border:2px solid var(--gray); white-space:nowrap; box-shadow:0 3px 0 var(--gray);}
  .start-pop:after{content:''; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); border:8px solid transparent; border-top-color:#fff;}

  /* tabbar */
  .tabbar{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:2px solid var(--gray); display:flex;
    max-width:560px; margin:0 auto; padding-bottom:env(safe-area-inset-bottom); z-index:20;}
  .tabbar button{flex:1; padding:10px 0 12px; font-size:11px; font-weight:800; color:var(--gray-d); display:flex; flex-direction:column; align-items:center; gap:3px;}
  .tabbar button .ic{font-size:24px;}
  .tabbar button.active{color:var(--green);}

  /* generic */
  .sec{font-size:15px; text-transform:uppercase; letter-spacing:.5px; color:var(--gray-d); margin:24px 0 10px;}
  .stat-box{flex:1; border:2px solid var(--gray); border-radius:14px; padding:12px; text-align:center;}
  .stat-box .v{font-size:24px; font-weight:800;} .stat-box .l{font-size:12px; color:var(--gray-d); font-weight:700;}
  .stat-box.green{border-color:var(--green);} .stat-box.green .v{color:var(--green);}

  /* cards screen */
  #cardsStats, .prof-stats{display:flex; gap:10px; margin-bottom:6px;}
  .big-cta{width:100%; background:var(--green); color:#fff; font-size:17px; font-weight:800; padding:16px; border-radius:14px;
    box-shadow:0 4px 0 var(--green-d); margin:16px 0; text-transform:uppercase; letter-spacing:.5px;}
  .big-cta:active{transform:translateY(2px); box-shadow:0 2px 0 var(--green-d);}
  .all-done{text-align:center; padding:30px 10px; font-size:40px;} .all-done p{font-size:18px; font-weight:800; margin:8px 0 2px; color:var(--text);} .all-done span{font-size:14px;}
  .wordlist{display:flex; flex-direction:column; gap:8px;}
  .wordrow{display:flex; justify-content:space-between; align-items:center; gap:10px; border:2px solid var(--gray); border-radius:12px; padding:10px 14px; font-size:15px;}
  .mini-bar{width:80px; height:8px; background:var(--gray); border-radius:6px; overflow:hidden;} .mini-bar>div{height:100%; background:var(--green);}
  .badge.green{font-size:11px;}

  /* review */
  #review,#lesson,#endScreen,#overScreen{position:fixed; inset:0; background:#fff; z-index:50; display:flex; flex-direction:column;}
  .lesson-top{display:flex; align-items:center; gap:14px; padding:calc(14px + env(safe-area-inset-top)) 18px 14px; max-width:560px; margin:0 auto; width:100%;}
  .close-btn{font-size:26px; color:var(--gray-d); font-weight:700;}
  .progressbar{flex:1; height:16px; background:var(--gray); border-radius:10px; overflow:hidden;}
  .progressbar>div{height:100%; background:var(--green); width:0; border-radius:10px; transition:width .3s;}
  .hearts-mini{color:var(--red); font-weight:800;}
  .lesson-body{flex:1; overflow-y:auto; max-width:560px; margin:0 auto; width:100%; padding:10px 20px;}
  .q-title{font-size:22px; font-weight:800; margin:14px 0 22px;}
  .card-face{font-size:30px; font-weight:800; text-align:center; margin:30px 0 8px;}
  .card-ex{text-align:center; font-size:15px; margin-bottom:24px;}
  .speak-inline,.speak-row .speak-btn{color:#fff;}
  .speak-inline{background:var(--blue); border-radius:8px; padding:2px 10px; font-size:14px; color:#fff;}

  .speak-row{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
  .speak-btn{background:var(--blue); width:62px; height:62px; border-radius:16px; font-size:26px; box-shadow:0 4px 0 #1899d6; flex-shrink:0;}
  .speak-btn:active{transform:translateY(2px); box-shadow:0 2px 0 #1899d6;}

  .choices{display:flex; flex-direction:column; gap:12px;}
  .choice{border:2px solid var(--gray); border-bottom-width:4px; border-radius:14px; padding:15px 18px; font-size:17px; font-weight:700; text-align:left; display:flex; align-items:center; gap:12px; background:#fff;}
  .choice:active{transform:translateY(2px);}
  .choice.sel{border-color:var(--blue); background:#ddf4ff; color:#1899d6;}
  .choice.correct{border-color:var(--green); background:#d7ffb8; color:var(--green-d);}
  .choice.wrong{border-color:var(--red); background:#ffdfe0; color:var(--red);}
  .choice .num{font-size:13px; border:2px solid var(--gray); border-radius:8px; padding:1px 7px; color:var(--gray-d);}

  .answer-area{min-height:60px; border-bottom:2px solid var(--gray); display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; padding:8px 0; margin-bottom:18px;}
  .bank{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .tile{border:2px solid var(--gray); border-bottom-width:4px; border-radius:12px; padding:9px 15px; font-size:18px; font-weight:700; background:#fff;}
  .tile:active{transform:translateY(2px);} .tile.used{visibility:hidden;}

  .match-grid{display:flex; gap:14px;} .match-col{flex:1; display:flex; flex-direction:column; gap:10px;}
  .match-btn{border:2px solid var(--gray); border-bottom-width:4px; border-radius:12px; padding:15px 8px; font-size:16px; font-weight:700; background:#fff;}
  .match-btn.sel{border-color:var(--blue); background:#ddf4ff; color:#1899d6;}
  .match-btn.done{border-color:var(--gray); background:#f0f0f0; color:#bbb; pointer-events:none;}
  .match-btn.wrong{border-color:var(--red); background:#ffdfe0;}

  .info-card{padding:10px 0;} .info-card h2{font-size:24px; margin:6px 0 16px;}
  .info-text{font-size:17px; line-height:1.6; background:#f0f7ff; border:2px solid #cfe8ff; border-radius:14px; padding:16px 18px;}
  .info-text i{color:#1899d6; font-style:normal; font-weight:700;}

  .lesson-foot{border-top:2px solid var(--gray); padding:14px 20px calc(14px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; width:100%;}
  .check-btn{width:100%; background:var(--green); color:#fff; font-size:16px; font-weight:800; padding:15px; border-radius:14px; box-shadow:0 4px 0 var(--green-d); text-transform:uppercase; letter-spacing:.5px;}
  .check-btn:disabled{background:var(--gray); color:var(--gray-d); box-shadow:0 4px 0 #c8c8c8;}
  .check-btn:active:not(:disabled){transform:translateY(2px); box-shadow:0 2px 0 var(--green-d);}
  .feedback{padding:16px 20px; max-width:560px; margin:0 auto; width:100%;}
  .feedback.ok{background:#d7ffb8;} .feedback.no{background:#ffdfe0;}
  .feedback h3{margin:0 0 4px; font-size:18px;} .feedback.ok h3{color:var(--green-d);} .feedback.no h3{color:var(--red);}
  .feedback p{margin:0; font-weight:700;} .feedback.ok p{color:var(--green-d);} .feedback.no p{color:var(--red);}
  .continue-btn{margin-top:12px;} .continue-btn.no{background:var(--red); box-shadow:0 4px 0 #d33;}

  .center-screen-inner{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; gap:18px;}
  .big-emoji{font-size:80px;} .center-screen-inner h1{font-size:28px; margin:0;}
  .reward-row{display:flex; gap:12px;} .reward{border:3px solid var(--yellow); border-radius:14px; padding:10px 14px; min-width:84px;}
  .reward .l{font-size:11px; color:var(--gray-d); font-weight:800; text-transform:uppercase;} .reward .v{font-size:22px; font-weight:800; color:#e6b800;}
  .reward.blue{border-color:var(--blue);} .reward.blue .v{color:var(--blue);}
  .reward.green{border-color:var(--green);} .reward.green .v{color:var(--green);}

  /* write */
  .write-card{border:2px solid var(--gray); border-radius:16px; padding:16px;}
  .write-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .link-btn{color:var(--blue); font-weight:700; font-size:13px;}
  .write-task{font-size:18px; font-weight:700; margin-bottom:8px;}
  #writeText{width:100%; min-height:120px; border:2px solid var(--gray); border-radius:12px; padding:12px; font-size:16px; font-family:inherit; margin:12px 0; resize:vertical;}
  .teacher-card{border:2px solid var(--blue); border-radius:14px; padding:16px; margin-top:14px; background:#f5fbff;}
  .teacher-card h4{margin:14px 0 6px; font-size:15px;}
  .score-row{display:flex; align-items:center; gap:14px;} .score-big{font-size:40px; font-weight:800; color:var(--blue);} .score-big span{font-size:18px; color:var(--gray-d);}
  .corrected{background:#fff; border:2px solid var(--green); border-radius:10px; padding:10px 12px; font-weight:700;}
  .mistakes{margin:0; padding-left:18px;} .mistakes li{margin-bottom:10px;}
  .wrong-t{color:var(--red); text-decoration:line-through; font-weight:700;} .right-t{color:var(--green-d); font-weight:700;}
  .encourage{margin-top:14px; background:#fff5d6; border-radius:10px; padding:10px 12px; font-weight:700; color:#a6810a;}
  .hist{border:2px solid var(--gray); border-radius:12px; padding:10px 14px; margin-bottom:8px;} .hist-text{font-size:14px;}

  /* profile */
  .seg{display:flex; gap:8px;} .seg button{flex:1; border:2px solid var(--gray); border-bottom-width:4px; border-radius:12px; padding:12px; font-weight:800; font-size:15px; background:#fff; color:var(--text);}
  .seg button.on{border-color:var(--blue); background:#ddf4ff; color:#1899d6;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:2px solid var(--gray); border-radius:20px; padding:8px 14px; font-weight:700; font-size:14px; background:#fff; color:var(--text);}
  .chip.on{border-color:var(--green); background:#e9ffd6; color:var(--green-d);}
  .row-line{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--gray); font-weight:700;}
  .row-line input[type=time]{font-size:16px; padding:6px; border:2px solid var(--gray); border-radius:8px;}
  input[type=checkbox]{width:22px; height:22px;}
  .text-input{width:100%; border:2px solid var(--gray); border-radius:12px; padding:12px; font-size:15px; font-family:inherit; margin-bottom:8px;}
  .sec-btn{width:100%; border:2px solid var(--gray); border-bottom-width:4px; border-radius:12px; padding:13px; font-weight:800; background:#fff; color:var(--text); margin-bottom:8px;}
  .sec-btn.ghost{color:var(--blue); border-color:#bfe6fb;}
  .sec-btn.danger{color:var(--red); border-color:#ffc9c9;}

  /* chat */
  .chat-topics{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
  .chat-start-hint{margin:18px 0 6px;}
  .chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 200px); min-height:360px;}
  .chat-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .chat-msgs{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 2px;}
  .bubble{max-width:82%; padding:11px 14px; border-radius:16px; font-size:16px; line-height:1.4; position:relative;}
  .bubble.teacher{align-self:flex-start; background:#eef6ff; border:2px solid #cfe8ff; border-bottom-left-radius:5px;}
  .bubble.me{align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:5px;}
  .bubble .play{background:var(--blue); color:#fff; border-radius:7px; padding:1px 8px; font-size:13px; margin-left:6px;}
  .bubble .tip{margin-top:8px; padding-top:8px; border-top:1px dashed #b9d9f3; font-size:13px; color:#a6810a;}
  .bubble.typing{color:var(--gray-d); font-style:italic;}
  .chat-input{display:flex; gap:8px; align-items:flex-end; padding-top:10px; border-top:2px solid var(--gray);}
  .chat-input textarea{flex:1; min-height:46px; max-height:120px; border:2px solid var(--gray); border-radius:14px; padding:11px 12px; font-size:16px; font-family:inherit; resize:none;}
  .icon-btn{width:48px; height:48px; border-radius:14px; font-size:22px; flex-shrink:0; color:#fff; display:flex; align-items:center; justify-content:center;}
  .icon-btn.mic{background:var(--purple);} .icon-btn.mic.rec{background:var(--red); animation:pulse 1s infinite;}
  .icon-btn.send{background:var(--green);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 20px; border-radius:12px; font-weight:700; z-index:99; opacity:0; transition:.3s; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
  .shake{animation:shake .4s;} @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>

<!-- HUD -->
<div class="topbar">
  <div class="stat flame">🔥 <span id="hud-streak">0</span></div>
  <div class="stat gem">💎 <span id="hud-gems">0</span></div>
  <div class="spacer"></div>
  <div class="stat" style="color:var(--green)">⭐ <span id="hud-xp">0</span></div>
</div>

<!-- SCREENS -->
<div class="app">
  <div id="screen-learn"><div id="path"></div></div>
  <div id="screen-cards" class="hidden">
    <div id="cardsStats"></div>
    <div id="cardsArea"></div>
  </div>
  <div id="screen-chat" class="hidden"></div>
  <div id="screen-write" class="hidden"></div>
  <div id="screen-profile" class="hidden"></div>
</div>

<!-- TABBAR -->
<div class="tabbar" id="tabbar">
  <button id="tab-learn" class="active" onclick="go('learn')"><span class="ic">🏠</span>Учёба</button>
  <button id="tab-cards" onclick="go('cards')"><span class="ic">🗂️</span>Карточки</button>
  <button id="tab-chat" onclick="go('chat')"><span class="ic">💬</span>Диалог</button>
  <button id="tab-write" onclick="go('write')"><span class="ic">✍️</span>Письмо</button>
  <button id="tab-profile" onclick="go('profile')"><span class="ic">⚙️</span>Профиль</button>
</div>

<!-- LESSON -->
<div id="lesson" class="hidden">
  <div class="lesson-top">
    <button class="close-btn" onclick="quitLesson()">✕</button>
    <div class="progressbar"><div id="lessonProgress"></div></div>
  </div>
  <div class="lesson-body" id="lessonBody"></div>
  <div id="lessonFootArea"></div>
</div>

<!-- REVIEW -->
<div id="review" class="hidden">
  <div class="lesson-top">
    <button class="close-btn" onclick="quitReview()">✕</button>
    <div class="progressbar"><div id="reviewProgress"></div></div>
  </div>
  <div class="lesson-body" id="reviewBody"></div>
</div>

<!-- END -->
<div id="endScreen" class="hidden">
  <div class="center-screen-inner">
    <div class="big-emoji">🎉</div><h1>Урок пройден!</h1>
    <div class="reward-row">
      <div class="reward"><div class="l">Опыт</div><div class="v" id="endXp">+0</div></div>
      <div class="reward blue"><div class="l">Точность</div><div class="v" id="endAcc">0%</div></div>
      <div class="reward green"><div class="l">Слов</div><div class="v" id="endWords">0</div></div>
    </div>
    <button class="check-btn" style="max-width:300px" onclick="backFromLesson()">Продолжить</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
