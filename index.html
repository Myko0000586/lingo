<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lingo — учим английский</title>

<!-- ===== PWA / установка на iPhone ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS: полноэкранный режим и иконка на домашнем экране -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lingo">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --red:#ff4b4b;
    --yellow:#ffc800; --purple:#ce82ff; --gray:#e5e5e5; --gray-d:#afafaf;
    --text:#3c3c3c; --bg:#fff; --card:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:'Segoe UI',-apple-system,system-ui,sans-serif;
    background:#f7f7f7; color:var(--text); overflow-x:hidden;
  }
  button{font-family:inherit; cursor:pointer; border:none;}
  .hidden{display:none !important;}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:10; background:#fff;
    display:flex; align-items:center; gap:16px; padding:14px 18px;
    border-bottom:2px solid var(--gray); max-width:520px; margin:0 auto;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .stat{display:flex; align-items:center; gap:5px; font-weight:800; font-size:18px;}
  .stat.flame{color:#ff9600;} .stat.gem{color:var(--blue);} .stat.heart{color:var(--red);}
  .topbar .spacer{flex:1;}

  .wrap{max-width:520px; margin:0 auto; padding:18px 18px 120px;}

  /* ---- Path / units ---- */
  .unit-head{
    background:var(--green); color:#fff; border-radius:16px; padding:18px 20px;
    margin:26px 0 8px; box-shadow:0 4px 0 var(--green-d);
  }
  .unit-head.locked{background:var(--gray-d); box-shadow:0 4px 0 #8e8e8e;}
  .unit-head h2{margin:0 0 4px; font-size:20px;}
  .unit-head p{margin:0; opacity:.9; font-size:14px;}

  .lessons{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0;}
  .node{
    width:74px; height:66px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:30px; position:relative;
    transition:transform .1s; user-select:none;
  }
  .node:active{transform:translateY(3px);}
  .node.done{background:var(--yellow); box-shadow:0 5px 0 #d8a800;}
  .node.active{background:var(--green); box-shadow:0 5px 0 var(--green-d);}
  .node.locked{background:var(--gray); box-shadow:0 5px 0 #c8c8c8; color:#b0b0b0; cursor:not-allowed;}
  .node .crown{position:absolute; top:-12px; font-size:18px;}
  .node-label{font-size:12px; color:var(--gray-d); font-weight:700; margin-top:2px;}
  /* zigzag */
  .lessons .row{display:flex; justify-content:center; width:100%;}
  .off-0{transform:translateX(0);} .off-1{transform:translateX(-70px);}
  .off-2{transform:translateX(-100px);} .off-3{transform:translateX(-70px);}
  .off-4{transform:translateX(0);} .off-5{transform:translateX(70px);}
  .off-6{transform:translateX(100px);} .off-7{transform:translateX(70px);}

  .start-pop{
    position:absolute; top:-44px; left:50%; transform:translateX(-50%);
    background:#fff; color:var(--green); font-weight:800; font-size:13px;
    padding:8px 14px; border-radius:12px; border:2px solid var(--gray);
    white-space:nowrap; box-shadow:0 3px 0 var(--gray);
  }
  .start-pop:after{content:''; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
    border:8px solid transparent; border-top-color:#fff;}

  /* ---- Lesson screen ---- */
  #lesson{position:fixed; inset:0; background:#fff; z-index:50; display:flex; flex-direction:column;}
  .lesson-top{display:flex; align-items:center; gap:14px; padding:16px 18px; max-width:560px; margin:0 auto; width:100%;}
  .close-btn{font-size:26px; color:var(--gray-d); background:none; font-weight:700;}
  .progressbar{flex:1; height:16px; background:var(--gray); border-radius:10px; overflow:hidden;}
  .progressbar > div{height:100%; background:var(--green); width:0; border-radius:10px; transition:width .3s;}
  .hearts-mini{color:var(--red); font-weight:800; display:flex; align-items:center; gap:4px;}

  .lesson-body{flex:1; overflow-y:auto; max-width:560px; margin:0 auto; width:100%; padding:10px 20px;}
  .q-title{font-size:23px; font-weight:800; margin:14px 0 22px;}

  .speak-row{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
  .speak-btn{
    background:var(--blue); color:#fff; width:62px; height:62px; border-radius:16px;
    font-size:26px; box-shadow:0 4px 0 #1899d6; flex-shrink:0;
  }
  .speak-btn:active{transform:translateY(2px); box-shadow:0 2px 0 #1899d6;}
  .sentence{font-size:22px; font-weight:700; border-bottom:2px dashed var(--gray-d); padding-bottom:4px;}

  /* choices */
  .choices{display:flex; flex-direction:column; gap:12px;}
  .choice{
    border:2px solid var(--gray); border-bottom-width:4px; border-radius:14px;
    padding:16px 18px; font-size:18px; font-weight:700; background:#fff; text-align:left;
    display:flex; align-items:center; gap:12px; transition:.05s;
  }
  .choice:active{transform:translateY(2px);}
  .choice.sel{border-color:var(--blue); background:#ddf4ff; color:#1899d6;}
  .choice.correct{border-color:var(--green); background:#d7ffb8; color:var(--green-d);}
  .choice.wrong{border-color:var(--red); background:#ffdfe0; color:var(--red);}
  .choice .num{font-size:13px; border:2px solid var(--gray); border-radius:8px; padding:1px 7px; color:var(--gray-d);}

  /* word bank */
  .answer-area{min-height:64px; border-bottom:2px solid var(--gray); display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; padding:8px 0; margin-bottom:18px;}
  .bank{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .tile{
    border:2px solid var(--gray); border-bottom-width:4px; border-radius:12px;
    padding:9px 15px; font-size:18px; font-weight:700; background:#fff; color:var(--text); transition:.05s;
  }
  .tile:active{transform:translateY(2px);}
  .tile.used{visibility:hidden;}

  /* matching */
  .match-grid{display:flex; gap:14px;}
  .match-col{flex:1; display:flex; flex-direction:column; gap:10px;}
  .match-btn{border:2px solid var(--gray); border-bottom-width:4px; border-radius:12px; padding:15px 8px; font-size:17px; font-weight:700; background:#fff;}
  .match-btn.sel{border-color:var(--blue); background:#ddf4ff; color:#1899d6;}
  .match-btn.done{border-color:var(--gray); background:#f0f0f0; color:#bbb; pointer-events:none;}

  /* footer */
  .lesson-foot{border-top:2px solid var(--gray); padding:16px 20px; max-width:560px; margin:0 auto; width:100%;}
  .check-btn{
    width:100%; background:var(--green); color:#fff; font-size:17px; font-weight:800;
    padding:15px; border-radius:14px; box-shadow:0 4px 0 var(--green-d); letter-spacing:.5px; text-transform:uppercase;
  }
  .check-btn:disabled{background:var(--gray); color:var(--gray-d); box-shadow:0 4px 0 #c8c8c8; cursor:default;}
  .check-btn:active:not(:disabled){transform:translateY(2px); box-shadow:0 2px 0 var(--green-d);}

  .feedback{padding:16px 20px; max-width:560px; margin:0 auto; width:100%;}
  .feedback.ok{background:#d7ffb8;} .feedback.no{background:#ffdfe0;}
  .feedback h3{margin:0 0 4px; font-size:19px;}
  .feedback.ok h3{color:var(--green-d);} .feedback.no h3{color:var(--red);}
  .feedback p{margin:0; font-weight:700;}
  .feedback.ok p{color:var(--green-d);} .feedback.no p{color:var(--red);}
  .continue-btn{margin-top:12px;}
  .continue-btn.no{background:var(--red); box-shadow:0 4px 0 #d33;}

  /* result / end screen */
  .center-screen{position:fixed; inset:0; background:#fff; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; gap:18px;}
  .center-screen h1{font-size:30px; margin:0;}
  .big-emoji{font-size:80px;}
  .reward-row{display:flex; gap:14px;}
  .reward{border:3px solid var(--yellow); border-radius:14px; padding:10px 16px; min-width:90px;}
  .reward .l{font-size:12px; color:var(--gray-d); font-weight:800; text-transform:uppercase;}
  .reward .v{font-size:22px; font-weight:800; color:#e6b800;}
  .reward.blue{border-color:var(--blue);} .reward.blue .v{color:var(--blue);}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 20px; border-radius:12px; font-weight:700; z-index:99; opacity:0; transition:.3s;}
  .toast.show{opacity:1;}

  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>

<!-- ============ HOME / PATH ============ -->
<div id="home">
  <div class="topbar">
    <div class="stat flame">🔥 <span id="streak">0</span></div>
    <div class="stat gem">💎 <span id="gems">0</span></div>
    <div class="spacer"></div>
    <div class="stat heart">❤️ <span id="hearts">5</span></div>
  </div>
  <div class="wrap" id="path"></div>
</div>

<!-- ============ LESSON ============ -->
<div id="lesson" class="hidden">
  <div class="lesson-top">
    <button class="close-btn" onclick="quitLesson()">✕</button>
    <div class="progressbar"><div id="lessonProgress"></div></div>
    <div class="hearts-mini">❤️ <span id="lessonHearts">5</span></div>
  </div>
  <div class="lesson-body" id="lessonBody"></div>
  <div id="lessonFootArea">
    <div class="lesson-foot">
      <button class="check-btn" id="checkBtn" onclick="checkAnswer()" disabled>Проверить</button>
    </div>
  </div>
</div>

<!-- ============ END SCREEN ============ -->
<div id="endScreen" class="center-screen hidden">
  <div class="big-emoji">🎉</div>
  <h1>Урок пройден!</h1>
  <div class="reward-row">
    <div class="reward"><div class="l">Опыт</div><div class="v" id="endXp">+0</div></div>
    <div class="reward blue"><div class="l">Точность</div><div class="v" id="endAcc">0%</div></div>
  </div>
  <button class="check-btn" style="max-width:300px" onclick="backHome()">Продолжить</button>
</div>

<!-- ============ GAME OVER ============ -->
<div id="overScreen" class="center-screen hidden">
  <div class="big-emoji">💔</div>
  <h1>Закончились жизни</h1>
  <p style="color:var(--gray-d); font-weight:700; max-width:300px;">Жизни восстановятся со временем, или начни урок заново.</p>
  <button class="check-btn" style="max-width:300px" onclick="backHome()">На главную</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ДАННЫЕ КУРСА — юниты, уроки, задания
   Типы заданий:
     'choice'   — выбери перевод (multiple choice)
     'build'    — собери предложение из слов
     'listen'   — выбери что услышал (озвучка)
     'match'    — соедини пары
   ============================================================ */
const COURSE = [
  {
    title:"Юнит 1 · Основы",
    desc:"Знакомство и простые слова",
    lessons:[
      [ // lesson 1
        {type:'choice', q:'Выбери перевод: «привет»', a:'hello', options:['hello','goodbye','please','thanks']},
        {type:'choice', q:'Выбери перевод: «спасибо»', a:'thank you', options:['sorry','thank you','hello','yes']},
        {type:'match', q:'Соедини пары', pairs:[['кот','cat'],['собака','dog'],['дом','house'],['вода','water']]},
        {type:'listen', q:'Что ты услышал?', a:'water', options:['water','winter','wonder','wander']},
        {type:'build', q:'Переведи: «Я студент»', a:'I am a student', words:['I','am','a','student','is','you']},
      ],
      [ // lesson 2
        {type:'choice', q:'Выбери перевод: «да»', a:'yes', options:['no','yes','maybe','ok']},
        {type:'build', q:'Переведи: «Это собака»', a:'this is a dog', words:['this','is','a','dog','cat','the']},
        {type:'listen', q:'Что ты услышал?', a:'apple', options:['apple','table','people','simple']},
        {type:'match', q:'Соедини пары', pairs:[['яблоко','apple'],['книга','book'],['красный','red'],['большой','big']]},
        {type:'choice', q:'Выбери перевод: «до свидания»', a:'goodbye', options:['hello','goodbye','sorry','night']},
      ],
      [ // lesson 3
        {type:'build', q:'Переведи: «Она моя мама»', a:'she is my mom', words:['she','is','my','mom','he','dad']},
        {type:'choice', q:'Выбери перевод: «вода»', a:'water', options:['fire','water','bread','milk']},
        {type:'listen', q:'Что ты услышал?', a:'house', options:['house','mouse','horse','hose']},
        {type:'match', q:'Соедини пары', pairs:[['мама','mom'],['папа','dad'],['брат','brother'],['друг','friend']]},
      ],
    ]
  },
  {
    title:"Юнит 2 · Еда и напитки",
    desc:"Заказываем в кафе",
    lessons:[
      [
        {type:'match', q:'Соедини пары', pairs:[['хлеб','bread'],['молоко','milk'],['кофе','coffee'],['чай','tea']]},
        {type:'choice', q:'Выбери перевод: «Я хочу есть»', a:'I am hungry', options:['I am hungry','I am tired','I am happy','I am thirsty']},
        {type:'build', q:'Переведи: «Я хочу кофе»', a:'I want coffee', words:['I','want','coffee','tea','need','a']},
        {type:'listen', q:'Что ты услышал?', a:'orange', options:['orange','apple','banana','grape']},
        {type:'choice', q:'Выбери перевод: «вкусно»', a:'delicious', options:['delicious','expensive','cold','empty']},
      ],
      [
        {type:'build', q:'Переведи: «Сколько это стоит?»', a:'how much is it', words:['how','much','is','it','many','are']},
        {type:'choice', q:'Выбери перевод: «счёт, пожалуйста»', a:'the check please', options:['the check please','the menu please','one more please','thank you please']},
        {type:'match', q:'Соедини пары', pairs:[['рыба','fish'],['мясо','meat'],['рис','rice'],['суп','soup']]},
        {type:'listen', q:'Что ты услышал?', a:'sugar', options:['sugar','super','silver','singer']},
      ],
    ]
  },
  {
    title:"Юнит 3 · Каждый день",
    desc:"Распорядок и действия",
    lessons:[
      [
        {type:'choice', q:'Выбери перевод: «работать»', a:'to work', options:['to work','to walk','to talk','to wake']},
        {type:'build', q:'Переведи: «Я иду домой»', a:'I go home', words:['I','go','home','to','come','house']},
        {type:'match', q:'Соедини пары', pairs:[['спать','sleep'],['есть','eat'],['пить','drink'],['читать','read']]},
        {type:'listen', q:'Что ты услышал?', a:'morning', options:['morning','meaning','warning','mourning']},
        {type:'build', q:'Переведи: «Сейчас восемь часов»', a:'it is eight o clock', words:['it','is','eight','o','clock','nine','seven']},
      ],
    ]
  },
];

/* ============================================================
   СОСТОЯНИЕ / СОХРАНЕНИЕ
   ============================================================ */
const MAX_HEARTS = 5;
const defaultState = {hearts:MAX_HEARTS, gems:0, streak:0, lastDay:null, progress:{}};
let S = load();

function load(){
  try{
    const raw = localStorage.getItem('lingo');
    if(raw){ return Object.assign({}, defaultState, JSON.parse(raw)); }
  }catch(e){}
  return Object.assign({}, defaultState);
}
function save(){ localStorage.setItem('lingo', JSON.stringify(S)); }

function lessonKey(u,l){ return u+'-'+l; }
function isDone(u,l){ return !!S.progress[lessonKey(u,l)]; }

// первый незавершённый урок в юните = активный; юнит разблокирован если предыдущий пройден полностью
function unitUnlocked(u){
  if(u===0) return true;
  const prev = COURSE[u-1];
  return prev.lessons.every((_,l)=>isDone(u-1,l));
}
function lessonUnlocked(u,l){
  if(!unitUnlocked(u)) return false;
  if(l===0) return true;
  return isDone(u,l-1);
}

/* ---- streak: засчитываем день при прохождении урока ---- */
function bumpStreak(){
  const today = new Date().toDateString();
  if(S.lastDay === today) return;
  const yest = new Date(Date.now()-864e5).toDateString();
  S.streak = (S.lastDay===yest) ? S.streak+1 : 1;
  S.lastDay = today;
}

/* ============================================================
   РЕНДЕР ГЛАВНОГО ЭКРАНА
   ============================================================ */
function renderHome(){
  document.getElementById('streak').textContent = S.streak;
  document.getElementById('gems').textContent = S.gems;
  document.getElementById('hearts').textContent = S.hearts;

  const path = document.getElementById('path');
  path.innerHTML = '';
  COURSE.forEach((unit,u)=>{
    const uLocked = !unitUnlocked(u);
    const head = document.createElement('div');
    head.className = 'unit-head'+(uLocked?' locked':'');
    head.innerHTML = `<h2>${unit.title}</h2><p>${uLocked?'🔒 Заверши предыдущий юнит':unit.desc}</p>`;
    path.appendChild(head);

    const lessons = document.createElement('div');
    lessons.className = 'lessons';
    unit.lessons.forEach((les,l)=>{
      const done = isDone(u,l);
      const unlocked = lessonUnlocked(u,l);
      const active = unlocked && !done;
      const row = document.createElement('div');
      row.className = 'row';
      const node = document.createElement('div');
      node.className = 'node off-'+(l%8)+' '+(done?'done':active?'active':'locked');
      node.innerHTML = done ? '👑' : active ? '⭐' : '🔒';
      if(active){
        const pop = document.createElement('div');
        pop.className='start-pop'; pop.textContent='НАЧАТЬ';
        node.appendChild(pop);
      }
      if(unlocked){ node.onclick=()=>startLesson(u,l); }
      row.appendChild(node);
      lessons.appendChild(row);
    });
    path.appendChild(lessons);
  });
}

/* ============================================================
   ОЗВУЧКА
   ============================================================ */
function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   ЛОГИКА УРОКА
   ============================================================ */
let L = null; // текущая сессия урока

function startLesson(u,l){
  L = {u, l, items:COURSE[u].lessons[l], idx:0, correct:0, hearts:S.hearts, answered:false};
  if(L.hearts<=0){ showOver(); return; }
  document.getElementById('home').classList.add('hidden');
  document.getElementById('lesson').classList.remove('hidden');
  renderItem();
}

function quitLesson(){
  if(confirm('Выйти из урока? Прогресс этого урока не сохранится.')){ backHome(); }
}

function backHome(){
  document.getElementById('lesson').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderHome();
}

function setFootCheck(){
  document.getElementById('lessonFootArea').innerHTML =
    `<div class="lesson-foot"><button class="check-btn" id="checkBtn" onclick="checkAnswer()" disabled>Проверить</button></div>`;
}

function renderItem(){
  L.answered = false;
  L.selection = null;
  document.getElementById('lessonHearts').textContent = L.hearts;
  document.getElementById('lessonProgress').style.width = (L.idx/L.items.length*100)+'%';
  setFootCheck();
  const body = document.getElementById('lessonBody');
  const it = L.items[L.idx];
  body.className = 'lesson-body';

  if(it.type==='choice'){
    body.innerHTML = `<div class="q-title">${it.q}</div><div class="choices" id="choices"></div>`;
    const box = document.getElementById('choices');
    shuffle(it.options.slice()).forEach((opt,i)=>{
      const b=document.createElement('button');
      b.className='choice'; b.innerHTML=`<span class="num">${i+1}</span> ${opt}`;
      b.onclick=()=>{ document.querySelectorAll('#choices .choice').forEach(c=>c.classList.remove('sel'));
        b.classList.add('sel'); L.selection=opt; enableCheck(); speak(opt); };
      box.appendChild(b);
    });
  }
  else if(it.type==='listen'){
    body.innerHTML = `<div class="q-title">${it.q}</div>
      <div class="speak-row"><button class="speak-btn" onclick="speak('${it.a}')">🔊</button>
      <span style="color:var(--gray-d);font-weight:700">Нажми, чтобы прослушать</span></div>
      <div class="choices" id="choices"></div>`;
    speak(it.a);
    const box=document.getElementById('choices');
    shuffle(it.options.slice()).forEach((opt,i)=>{
      const b=document.createElement('button');
      b.className='choice'; b.innerHTML=`<span class="num">${i+1}</span> ${opt}`;
      b.onclick=()=>{ document.querySelectorAll('#choices .choice').forEach(c=>c.classList.remove('sel'));
        b.classList.add('sel'); L.selection=opt; enableCheck(); };
      box.appendChild(b);
    });
  }
  else if(it.type==='build'){
    body.innerHTML = `<div class="q-title">${it.q}</div>
      <div class="answer-area" id="answerArea"></div>
      <div class="bank" id="bank"></div>`;
    L.built=[];
    const bank=document.getElementById('bank');
    shuffle(it.words.slice()).forEach((w,i)=>{
      const t=document.createElement('button');
      t.className='tile'; t.textContent=w; t.dataset.i=i;
      t.onclick=()=>{ if(t.classList.contains('used'))return;
        t.classList.add('used'); L.built.push({w, el:t}); speak(w); redrawAnswer(); };
      bank.appendChild(t);
    });
  }
  else if(it.type==='match'){
    L.matchSel=null; L.matchDone=0;
    body.innerHTML = `<div class="q-title">${it.q}</div><div class="match-grid">
      <div class="match-col" id="colL"></div><div class="match-col" id="colR"></div></div>`;
    const left = it.pairs.map((p,i)=>({txt:p[0], id:i, side:'L'}));
    const right = it.pairs.map((p,i)=>({txt:p[1], id:i, side:'R'}));
    renderMatchCol('colL', shuffle(left.slice()), it);
    renderMatchCol('colR', shuffle(right.slice()), it);
    // у match нет кнопки "проверить" — засчитывается автоматически
    document.getElementById('lessonFootArea').innerHTML =
      `<div class="lesson-foot"><button class="check-btn" disabled>Соедини все пары</button></div>`;
  }
}

function renderMatchCol(colId, list, it){
  const col=document.getElementById(colId);
  list.forEach(item=>{
    const b=document.createElement('button');
    b.className='match-btn'; b.textContent=item.txt; b.dataset.id=item.id; b.dataset.side=item.side;
    b.onclick=()=>matchClick(b,it);
    col.appendChild(b);
  });
}

function matchClick(b,it){
  if(b.classList.contains('done')) return;
  if(b.dataset.side==='R') speak(b.textContent);
  if(!L.matchSel){
    clearMatchSel(); b.classList.add('sel'); L.matchSel=b; return;
  }
  if(L.matchSel===b){ b.classList.remove('sel'); L.matchSel=null; return; }
  // нужна пара с разных сторон
  if(L.matchSel.dataset.side===b.dataset.side){
    clearMatchSel(); b.classList.add('sel'); L.matchSel=b; return;
  }
  if(L.matchSel.dataset.id===b.dataset.id){
    L.matchSel.classList.remove('sel'); L.matchSel.classList.add('done'); b.classList.add('done');
    L.matchSel=null; L.matchDone++;
    if(L.matchDone===it.pairs.length){ L.correct++; setTimeout(nextItem,350); }
  } else {
    // неверно — мигаем красным, теряем жизнь
    const a=L.matchSel;
    a.classList.remove('sel'); a.classList.add('wrong'); b.classList.add('wrong');
    L.matchSel=null; loseHeart();
    setTimeout(()=>{ a.classList.remove('wrong'); b.classList.remove('wrong'); },500);
  }
}
function clearMatchSel(){ document.querySelectorAll('.match-btn.sel').forEach(x=>x.classList.remove('sel')); }

function redrawAnswer(){
  const area=document.getElementById('answerArea'); area.innerHTML='';
  L.built.forEach((b,i)=>{
    const t=document.createElement('button'); t.className='tile'; t.textContent=b.w;
    t.onclick=()=>{ b.el.classList.remove('used'); L.built.splice(i,1); redrawAnswer(); };
    area.appendChild(t);
  });
  L.built.length ? enableCheck() : disableCheck();
}

function enableCheck(){ const b=document.getElementById('checkBtn'); if(b) b.disabled=false; }
function disableCheck(){ const b=document.getElementById('checkBtn'); if(b) b.disabled=true; }

function norm(s){ return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }

function checkAnswer(){
  if(L.answered) return;
  const it=L.items[L.idx];
  let ok=false, user='';
  if(it.type==='choice'||it.type==='listen'){ user=L.selection; ok = norm(user)===norm(it.a); }
  else if(it.type==='build'){ user=L.built.map(b=>b.w).join(' '); ok = norm(user)===norm(it.a); }
  L.answered=true;
  if(ok){ L.correct++; showFeedback(true, it); }
  else { loseHeart(); showFeedback(false, it); if(L.hearts<=0){ /* покажем GO после continue */ } }
}

function showFeedback(ok, it){
  // подсветка вариантов
  if(it.type==='choice'||it.type==='listen'){
    document.querySelectorAll('#choices .choice').forEach(c=>{
      const txt=c.textContent.replace(/^\s*\d+\s*/,'').trim();
      if(norm(txt)===norm(it.a)) c.classList.add('correct');
      else if(c.classList.contains('sel')) c.classList.add('wrong');
    });
  }
  if(!ok){ document.getElementById('lessonBody').classList.add('shake');
    setTimeout(()=>document.getElementById('lessonBody').classList.remove('shake'),400); }

  const correctTxt = it.a;
  const fb = document.createElement('div');
  fb.className='feedback '+(ok?'ok':'no');
  fb.innerHTML = ok
    ? `<h3>✅ Отлично!</h3><p>${correctTxt}</p>`
    : `<h3>❌ Правильный ответ:</h3><p>${correctTxt}</p>`;
  const cont = document.createElement('button');
  cont.className='check-btn continue-btn '+(ok?'':'no');
  cont.textContent='Продолжить';
  cont.onclick = nextAfterFeedback;
  fb.appendChild(cont);
  document.getElementById('lessonFootArea').innerHTML='';
  document.getElementById('lessonFootArea').appendChild(fb);
  if(ok) speak(correctTxt);
}

function nextAfterFeedback(){
  if(L.hearts<=0){ S.hearts=0; save(); showOver(); return; }
  nextItem();
}

function nextItem(){
  L.idx++;
  if(L.idx>=L.items.length){ finishLesson(); return; }
  renderItem();
}

function loseHeart(){
  L.hearts--; if(L.hearts<0) L.hearts=0;
  document.getElementById('lessonHearts').textContent = L.hearts;
}

function finishLesson(){
  document.getElementById('lessonProgress').style.width='100%';
  // награды
  const total=L.items.length;
  const acc = Math.round(L.correct/total*100);
  const xp = 10 + L.correct*2;
  S.progress[lessonKey(L.u,L.l)] = true;
  S.gems += 5;
  S.hearts = L.hearts; // сохраняем оставшиеся жизни
  bumpStreak();
  save();
  document.getElementById('endXp').textContent = '+'+xp;
  document.getElementById('endAcc').textContent = acc+'%';
  document.getElementById('lesson').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
}

function showOver(){
  document.getElementById('lesson').classList.add('hidden');
  document.getElementById('overScreen').classList.remove('hidden');
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* старт */
renderHome();

/* регистрация service worker — офлайн-режим */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
